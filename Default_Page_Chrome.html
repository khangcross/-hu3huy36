    .top-bar {
      display: flex;

    }

    /* Chia tỉ lệ 3 phần bằng nhau để đẩy khung giờ ra chính giữa */
    .top-left, .top-center, .top-right {

    }

    /* Khu vực gộp chữ Xin chào và cụm GIF bộ ba Chiikawa */
    .greeting-container {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* ĐÃ SỬA: Thu nhỏ chữ Xin chào xuống 16px */
    .greeting {
      font-size: 16px; 
      text-shadow: 2px 2px 3px #000;
      white-space: nowrap;
    }

    /* ĐÃ SỬA: Thu nhỏ các ảnh GIF xuống 26px để cân bằng với cỡ chữ */
    .greeting-gif {
      width: 26px; 
      height: auto;
    }

    /* Đưa thông tin ngày giờ ra giữa */
    .top-center {
      text-align: center;
      text-shadow: 2px 2px 3px #000;
      line-height: 1.3;
    }

    /* ĐÃ SỬA: Thu nhỏ chữ ngày tháng xuống 14px */
  #date {
      margin-bottom: 2px;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.7); 
      text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.9), 0px 0px 5px rgba(0, 0, 0, 0.8);
    }

    /* Đồng hồ: Trắng tinh khiết, cỡ chữ nổi bật, đổ bóng kép (Double Shadow) siêu dày */
    #clock {
      font-size: 24px; 
      color: #ffffff; 
      /* Đổ bóng 2 lớp giúp chữ luôn luôn nổi bần bật dù bạn có thay nền trắng tinh đi chăng nữa */
      text-shadow: 2px 2px 3px rgba(0, 0, 0, 0.9), 0 0 6px rgba(0, 0, 0, 0.7);
    }
    /* Khu vực thời tiết ở góc phải cũ */
    .top-right {
      text-align: right;
      text-shadow: 2px 2px 3px #000;
    }

    /* ĐÃ SỬA: Thu nhỏ thời tiết xuống 16px cho đồng bộ với góc trái */
    #weather {
      font-size: 16px;
      color: #ffcc66;
    }

    /* Giữ nguyên vị trí layout shortcuts ban đầu của bạn */
    /* Giữ nguyên vị trí layout shortcuts ban đầu của bạn và không bị cuộn trang */
    .shortcuts {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
      max-width: 650px;
      margin: 0 auto; /* Đổi về 0 auto để không bị đẩy tràn màn hình */
      text-align: center;
      padding-top: 16cm; /* Quay lại dùng padding-top như code gốc của bạn để cố định vị trí */
    }

    /* Làm mới các ô chứa link cho sắc nét và đổi font */
    .shortcuts a {
      text-decoration: none;
      color: white;
      background: rgba(0, 0, 0, 0.72); 
      border: 1px solid rgba(255, 255, 255, 0.25); 
      padding: 12px 5px;
      border-radius: 8px;
      font-size: 18px; 
      transition: 0.25s;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      text-shadow: 1px 1px 2px #000; 
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3); 
    }

    .shortcuts a:hover {
      background: rgba(255, 255, 255, 0.25);
      border-color: #fff;
      transform: scale(1.06);
    }
  </style>

  <script>
    // 1. Cập nhật Đồng hồ và Ngày tháng
    function updateClock() {
      const now = new Date();
      const h = now.getHours().toString().padStart(2, '0');
      const m = now.getMinutes().toString().padStart(2, '0');
      const s = now.getSeconds().toString().padStart(2, '0');
      document.getElementById('clock').textContent = `${h}:${m}:${s}`;

      const day = now.getDate();
      const month = now.getMonth() + 1;
      const year = now.getFullYear();
      const weekday = ["Chủ Nhật", "Thứ 2", "Thứ 3", "Thứ 4", "Thứ 5", "Thứ 6", "Thứ 7"][now.getDay()];
      document.getElementById('date').textContent = `${weekday}, ngày ${day} tháng ${month} năm ${year}`;
    }

    setInterval(updateClock, 1000);
    updateClock();

    // 2. Tự động lấy thời tiết thực tế dựa trên tọa độ vị trí trình duyệt
    function getWeather() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(position => {
          const lat = position.coords.latitude;
          const lon = position.coords.longitude;
          
          fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`)
            .then(response => response.json())
            .then(data => {
              const temp = Math.round(data.current_weather.temperature);
              const code = data.current_weather.weathercode;
              
              let icon = "☀️";
              if (code >= 1 && code <= 3) icon = "🌤️";
              else if (code >= 45 && code <= 48) icon = "🌫️";
              else if (code >= 51 && code <= 67) icon = "🌧️";
              else if (code >= 71 && code <= 86) icon = "❄️";
              else if (code >= 95) icon = "⛈️";

              document.getElementById('weather').textContent = `${icon} ${temp}°C`;
            })
            .catch(() => {
              document.getElementById('weather').textContent = "☁️ 28°C"; 
            });
        }, () => {
          document.getElementById('weather').textContent = "📍 Cần bật GPS"; 
        });
      } else {
        document.getElementById('weather').textContent = "❌ Không hỗ trợ vị trí";
      }
    }

    getWeather();
  </script>
